<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gizzy Moves</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Custom Carousel Styles -->
  <style>
    /* Limit carousel height and ensure consistent image sizing */
    #heroCarousel {
      max-height: 400px;
      overflow: hidden;
    }
    #heroCarousel .carousel-item img {
      height: 400px;
      object-fit: cover;
      width: 100%;
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="#">
        <img src="nav/gizzy_moves.jpg" alt="Gizzy Moves Logo" width="190" height="70" class="d-inline-block align-text-top me-2 rounded-8px">
        
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false">
        <span class="navbar-toggler-icon"></span>
      </button>
    </div>
  </nav>

  <!-- Hero Carousel (dynamic from Photos folder) -->
  <div id="heroCarousel" class="carousel slide" data-bs-ride="carousel">
    <div class="carousel-indicators" id="heroIndicators"></div>
    <div class="carousel-inner" id="heroSlides"></div>
    <button class="carousel-control-prev" type="button" data-bs-target="#heroCarousel" data-bs-slide="prev">
      <span class="carousel-control-prev-icon"></span>
      <span class="visually-hidden">Previous</span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#heroCarousel" data-bs-slide="next">
      <span class="carousel-control-next-icon"></span>
      <span class="visually-hidden">Next</span>
    </button>
  </div>

  <!-- Contact Section -->
  <section id="contact" class="py-5">
    <div class="container">
      <h2 class="text-center mb-4">Contact Us</h2>
      <ul class="list-unstyled text-center">
        <li><strong>Contact Name:</strong> Dave</li>
        <li><strong>Phone:</strong> <a href="tel:0224874432">022 487 4432</a></li>
        <li><strong>Email:</strong> <a href="mailto:djc.holdings.nz@gmail.com">djc.holdings.nz@gmail.com</a></li>
        <li><strong>Facebook:</strong> <a href="https://www.facebook.com/profile.php?id=100089114265222" target="_blank">Gizzy Moves on Facebook</a></li>
      </ul>
    </div>
  </section>

  <!-- Reviews Section -->
  <section id="reviews" class="py-5 bg-light">
    <div class="container">
      <h2 class="text-center mb-4">What Our Customers Say</h2>
      <!-- Elfsight Facebook Reviews | GizzyMoves -->
      <script src="https://static.elfsight.com/platform/platform.js" async></script>
      <div class="elfsight-app-ddb4fd84-2ac3-4e6b-9dad-ff516e3dfac3" data-elfsight-app-lazy></div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="py-3 bg-dark text-white text-center">
    <div class="container">
      <p class="mb-0">&copy; 2025 Gizzy Moves. All Rights Reserved.</p>
    </div>
  </footer>

  <!-- Bootstrap JS (with Popper) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Dynamic Carousel Script: place your carousel images in the Photos folder -->
  <script>
    const slideFilenames = [
      '481007178_638580265789110_8556861724153191322_n.jpg',
      '481468214_645458391767964_4101064374974146449_n.jpg',
      '481516156_641471712166632_855524711161949273_n.jpg',
      '482235764_646773674969769_7187513664242018093_n.jpg',
      '486379377_660805916899878_4066727859176232168_n.jpg',
      '491812042_678915618422241_4028117492697448221_n.jpg',
      '493829685_687910487522754_1604272565996541211_n.jpg',
      '494526468_691136037200199_4878182600791527110_n.jpg',
      'truck.jpg'
    ];
    const indicators = document.getElementById('heroIndicators');
    const slides = document.getElementById('heroSlides');
    slideFilenames.forEach((file, index) => {
      // Indicator button
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.setAttribute('data-bs-target', '#heroCarousel');
      btn.setAttribute('data-bs-slide-to', index);
      if (index === 0) btn.classList.add('active');
      btn.setAttribute('aria-label', `Slide ${index + 1}`);
      indicators.appendChild(btn);
      // Slide item
      const div = document.createElement('div');
      div.classList.add('carousel-item');
      if (index === 0) div.classList.add('active');
      const img = document.createElement('img');
      img.src = `Photos/${file}`;
      img.classList.add('d-block', 'w-100');
      img.alt = `Slide ${index + 1}`;
      div.appendChild(img);
      slides.appendChild(div);
    });
  </script>
</body>
</html>
